<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,interactive-widget=resizes-content,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="7080 나이트"><meta name="theme-color" content="#12020c"><link rel="manifest" href="manifest.webmanifest">
<title>ERRDAY NIGHTCLUB · ERRDAY 7080 나이트</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
</head><body>
<a-scene renderer="antialias:auto;colorManagement:true" fog="type:exponential;color:#12020c;density:0.03" vr-mode-ui="enabled:false" loading-screen="enabled:false" device-orientation-permission-ui="enabled:false">
 <a-entity id="world"></a-entity>
 <a-entity id="others"></a-entity>
 <a-entity id="rig" position="0 0 6"><a-entity id="myAvatar"></a-entity></a-entity>
 <a-ring id="marker" rotation="-90 0 0" radius-inner="0.22" radius-outer="0.32" material="shader:flat;color:#ffd84a;opacity:.9;transparent:true" visible="false"></a-ring>
 <a-entity id="cam" camera="fov:70" position="0 3 10"></a-entity>
</a-scene>
<div id="loading"><div class="spin">🪩</div><div id="loadTxt">3D 모델 불러오는 중…</div></div>
<div id="entry" class="panel center">
 <h1>ERRDAY NIGHTCLUB</h1><div class="sub">ERRDAY 7080 나이트</div>
 <label>닉네임 <input id="nick" maxlength="16" placeholder="예: 춤신춤왕"></label>
 <div class="pv"><canvas id="preview" width="240" height="260"></canvas></div>
 <div class="row"><b>성별</b><button class="opt g sel" data-v="m">👨 남</button><button class="opt g" data-v="f">👩 여</button></div>
 <div class="row"><b>의상</b><span id="styles"></span></div>
 <div class="row"><b>옷 색</b><span id="sw"></span></div>
 <div class="row"><b>피부</b><span id="skins"></span></div>
 <div id="adultNote" style="display:flex;gap:10px;align-items:center;margin:10px auto;max-width:340px;padding:8px 12px;border:1px solid #ff4d6d;border-radius:10px;background:rgba(255,40,80,.12);color:#ffd6de;font-size:13px;line-height:1.45;text-align:left"><span style="flex:none;width:34px;height:34px;border-radius:50%;background:#e01e3c;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid #fff">19</span><span>이 공간은 성인 테마의 가상 나이트클럽입니다.<br>19세 미만은 이용을 자제해 주시기 바랍니다.</span></div>
 <button id="enter" class="big" disabled>입장하기 (소리 켜짐)</button>
 <p class="hint">바닥 클릭/탭 = 그 자리로 걸어가기 · 의자 클릭/탭 = 가서 앉기 · WASD 이동 · 드래그 = 시점 회전 · 휠/두 손가락 = 줌</p>
</div>
<div id="hud" class="hidden">
<div id="actBar" class="hidden"></div>
 <div id="topbar"><span id="where">🌐 로비</span><button id="setBtn">⚙</button><button id="adminBtn">🔑</button>
  <button id="fsBtn" title="전체화면">⛶</button><button id="muteBtn" title="내 소리 켜기/끄기">🔊</button><input id="vol" type="range" min="0" max="100" value="80" title="볼륨"></div>
 <button id="chatToggle" class="fab">💬</button><button id="musicToggle" class="fab">🎵</button>
 <div id="chat" class="panel"><div id="chatTitle">💬 전체 채팅<span id="onlineCnt"></span></div><div id="msgs"></div>
  <form id="chatForm"><input id="chatIn" maxlength="200" placeholder="메시지 입력 (Enter)" autocomplete="off"><button>전송</button></form></div>
 <div id="music" class="panel"><div>🎵 <b id="now">재생 중인 곡 없음</b> <button id="admFold" class="hidden" type="button" title="관리자 메뉴 접기/펴기">⚙ 관리자 ▲</button></div>
  <div id="adminCtl" class="hidden"><button data-c="play">▶</button><button data-c="pause">⏸</button><button data-c="skip">⏭</button><button data-c="shuffleToggle" id="shufBtn" title="랜덤 재생 켜기/끄기">🔀 랜덤 끔</button><button id="cleanBtn" type="button">🔄 새로고침(유령 정리)</button><button data-c="shuffleNow" title="대기열 순서 섞기">섞기</button>
   <div class="arow">MP3: <input type="file" id="file" accept=".mp3,audio/mpeg"></div>
   <form id="ytForm" class="arow"><input id="ytUrl" placeholder="링크 추가 (유튜브·사운드클라우드·비메오·mp3/라디오 주소)"><button>링크 추가</button></form><span id="upMsg"></span></div>
  <ol id="pl" class="hidden"></ol></div>
 <div id="fsHint" class="hidden">📱 아이폰은 공유 → <b>홈 화면에 추가</b> 후 열면 주소창 없이 전체화면으로 즐길 수 있어요 <button id="fsHintX">닫기</button></div>
 <button id="subsBtn" class="hidden">💬 자막 끔</button><button id="unmute" class="hidden">🔊 탭해서 소리 켜기</button>
 <div id="prompt" class="hidden"></div>
 <div id="mob"><div id="joyKnob"></div></div><div id="jumpBtn">⤒<br><small>점프</small></div>
</div>
<audio id="audio" preload="auto"></audio>
<div id="ytWrap"><div id="yt"></div></div>
<script src="theater.js"></script><script src="world.js"></script><script src="app.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
</body></html>
